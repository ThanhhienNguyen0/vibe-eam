name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate local Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate staging Compose configuration
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet

      - name: Run repository infrastructure validator
        run: |
          npm run validate:compose
          npm run validate:workflows
          npm run test:security
          npm run validate:prisma-config

      - name: Build backend and frontend container images
        run: docker compose --env-file .env.example -f docker-compose.yml build backend frontend

  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit all dependencies, enforce documented risk policy
        run: npm run scan:dependencies
      - name: Preserve complete audit even when the gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: .cache/security/audit.json
          if-no-files-found: warn

  secrets:
    name: Secret security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # No npm install or project lifecycle scripts before the secret scan.
      - run: npm run scan:secrets
