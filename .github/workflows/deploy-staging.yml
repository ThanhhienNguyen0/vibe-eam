name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Verify selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture immutable revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace backend

      - name: Verify application
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Validate staging Compose configuration
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet

  deploy:
    name: Deploy to staging server
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy selected revision and run internal healthcheck
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          DEPLOY_REF: ${{ needs.verify.outputs.verified_sha }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_REF"

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -se' -- "$DEPLOY_PATH" "$DEPLOY_REF" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_PATH=$1
          DEPLOY_REF=$2

          [[ "$DEPLOY_PATH" == "/var/www/eam-test" ]] || { echo "Unexpected staging deploy path." >&2; exit 1; }
          cd "$DEPLOY_PATH"
          test -f .env.staging || { echo "Server-side .env.staging is missing." >&2; exit 1; }
          ! grep -q 'replace-with-' .env.staging || { echo "Placeholder secret remains in .env.staging." >&2; exit 1; }

          echo "Deployment context (no environment values):"
          pwd
          git status --short
          git rev-parse --short HEAD || true
          docker --version
          docker compose version
          docker compose --env-file .env.staging -f docker-compose.staging.yml ps || true

          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo "Tracked server worktree changes block deployment." >&2; exit 1; }

          git fetch --all --prune --tags
          RESOLVED_REF=$(git rev-parse --verify "$DEPLOY_REF^{commit}")
          git checkout --detach "$RESOLVED_REF"
          git rev-parse --short HEAD

          show_compose_diagnostics() {
            echo "Compose status:"
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps || true
            echo "Backend logs (last 100 lines):"
            docker compose --env-file .env.staging -f docker-compose.staging.yml logs --tail=100 backend || true
            echo "Postgres logs (last 100 lines):"
            docker compose --env-file .env.staging -f docker-compose.staging.yml logs --tail=100 postgres || true
          }

          docker compose --env-file .env.staging -f docker-compose.staging.yml config --quiet
          if ! docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build; then
            echo "docker compose up failed." >&2
            show_compose_diagnostics
            exit 1
          fi
          docker compose --env-file .env.staging -f docker-compose.staging.yml ps

          for i in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:4400/api/health; then
              echo
              echo "Healthcheck succeeded."
              exit 0
            fi
            echo "Healthcheck failed, retry $i/12"
            sleep 5
          done

          echo "Healthcheck failed after retries" >&2
          show_compose_diagnostics
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
